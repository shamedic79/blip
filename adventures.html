<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Loot Library | Loot in a Boot</title>

<style>

/* =====================================================
   BASIC PAGE SETUP
===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;

  min-height: 100vh;

  color: #fff;

  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(40,80,110,.12),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #030406 0%,
      #06070a 60%,
      #020203 100%
    );
}

a {
  color: inherit;
}


/* =====================================================
   HEADER
===================================================== */

header {
  position: sticky;

  top: 0;

  z-index: 1000;

  display: flex;

  justify-content: space-between;
  align-items: center;

  padding: 18px 6%;

  background:
    rgba(3,4,6,.88);

  backdrop-filter:
    blur(14px);

  border-bottom:
    1px solid rgba(216,166,92,.12);
}

.header-logo img {
  width: 125px;

  display: block;

  filter: invert(1);
}

nav {
  display: flex;

  gap: 28px;
}

nav a {
  position: relative;

  text-decoration: none;

  color:
    rgba(255,255,255,.68);

  font-size: .93rem;
}

nav a:hover,
nav a.active {
  color: #e9c78c;
}

nav a.active::after {
  content: "";

  position: absolute;

  left: 8%;
  right: 8%;

  bottom: -11px;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #d89e4e,
      transparent
    );
}


/* =====================================================
   INTRO
===================================================== */

.page-intro {
  padding:
    42px 6%
    22px;

  text-align: center;
}

.page-intro p {
  max-width: 680px;

  margin: auto;

  color: #8d929c;

  font-size: .95rem;

  line-height: 1.7;
}


/* =====================================================
   LIBRARY BACKGROUND
===================================================== */

.library-stage {
  position: relative;

  width:
    min(1536px, 96vw);

  aspect-ratio:
    1536 / 1024;

  margin:
    10px auto
    90px;

  background-image:
    url("images/loot-library-bg.png");

  background-size:
    100% 100%;

  background-position:
    center;

  background-repeat:
    no-repeat;

  overflow: hidden;

  filter:
    drop-shadow(
      0 35px 80px
      rgba(0,0,0,.55)
    );
}


/* =====================================================
   BOOK BASE
===================================================== */

.book {
  position: absolute;

  display: block;

  border-radius:
    3px 6px 6px 3px;

  text-decoration: none;

  border:
    1px solid
    rgba(221,172,92,.40);

  box-shadow:
    inset 5px 0 8px
    rgba(0,0,0,.34),

    inset -2px 0 4px
    rgba(255,255,255,.025),

    4px 6px 10px
    rgba(0,0,0,.50);

  transform-origin:
    bottom center;

  transition:
    transform .22s ease,
    filter .22s ease,
    box-shadow .22s ease;

  z-index: 10;
}


/* =====================================================
   BOOK HOVER
===================================================== */

.book-link:hover {
  transform:
    translateY(-7%)
    scale(1.06);

  filter:
    brightness(1.18);

  box-shadow:
    inset 5px 0 8px
    rgba(0,0,0,.28),

    6px 12px 18px
    rgba(0,0,0,.55),

    0 0 22px
    rgba(216,157,74,.18);

  z-index: 50;
}


/* =====================================================
   GOLD INNER BOOK BORDER
===================================================== */

.book::before {
  content: "";

  position: absolute;

  inset:
    5% 10%;

  border:
    1px solid
    rgba(225,177,96,.34);

  border-radius:
    2px 4px 4px 2px;

  pointer-events: none;
}


/* =====================================================
   BOOK SPINE RIDGE
===================================================== */

.book::after {
  content: "";

  position: absolute;

  top: 0;
  bottom: 0;

  left: 12%;

  width: 1px;

  background:
    rgba(222,169,85,.25);

  box-shadow:
    2px 0 4px
    rgba(0,0,0,.28);
}


/* =====================================================
   BOOK SYMBOL
===================================================== */

.spine-symbol {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%,-50%);

  color: #d8ad67;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(.55rem,1vw,1rem);

  text-shadow:
    0 1px 2px
    rgba(0,0,0,.70);

  z-index: 2;
}


/* =====================================================
   BOOK COLOURS
===================================================== */

.book-blue {
  background:
    linear-gradient(
      90deg,
      #0d2035,
      #174d78 45%,
      #102d49
    );
}

.book-red {
  background:
    linear-gradient(
      90deg,
      #31100d,
      #75291f 45%,
      #451610
    );
}

.book-black {
  background:
    linear-gradient(
      90deg,
      #08090a,
      #1b1c1f 45%,
      #09090b
    );
}


/* =====================================================
   BOOK POSITIONS
===================================================== */

.book-shark {
  left: 24%;

  top: 35.6%;

  width: 5%;

  height: 16.2%;
}

.book-pirate {
  left: 30.3%;

  top: 36%;

  width: 4.8%;

  height: 15.8%;
}

.book-secret {
  left: 35.8%;

  top: 35.8%;

  width: 4.6%;

  height: 16%;
}


/* =====================================================
   HOVER LABEL
===================================================== */

.book-tooltip {
  position: absolute;

  left: 50%;

  bottom:
    calc(100% + 14px);

  transform:
    translateX(-50%)
    translateY(8px);

  width:
    max-content;

  max-width:
    220px;

  padding:
    10px 13px;

  border-radius:
    10px;

  background:
    rgba(8,6,5,.96);

  border:
    1px solid
    rgba(218,163,83,.35);

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.50);

  color:
    #e4c38d;

  text-align:
    center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    .80rem;

  line-height:
    1.35;

  opacity:
    0;

  pointer-events:
    none;

  transition:
    opacity .18s ease,
    transform .18s ease;

  z-index:
    100;
}

.book-link:hover .book-tooltip {
  opacity:
    1;

  transform:
    translateX(-50%)
    translateY(0);
}

.tooltip-status {
  display:
    block;

  margin-top:
    4px;

  color:
    #928773;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:
    .58rem;

  text-transform:
    uppercase;

  letter-spacing:
    .10em;
}


/* =====================================================
   MYSTERY BOOK
===================================================== */

.book-mystery {
  cursor:
    default;

  filter:
    brightness(.72);
}

.book-mystery .spine-symbol {
  opacity:
    .75;
}


/* =====================================================
   FOOTER
===================================================== */

footer {
  padding:
    40px 6%;

  border-top:
    1px solid
    rgba(255,255,255,.07);

  color:
    #737782;

  display:
    flex;

  justify-content:
    space-between;

  flex-wrap:
    wrap;

  gap:
    20px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

  nav {
    display:
      none;
  }

  header {
    padding:
      15px 5%;
  }

  .header-logo img {
    width:
      105px;
  }

  .page-intro {
    padding:
      30px 5%
      15px;
  }

  .library-stage {
    width:
      100vw;

    margin-bottom:
      45px;
  }

  .book-tooltip {
    display:
      none;
  }

  .spine-symbol {
    font-size:
      clamp(.38rem,2vw,.7rem);
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <a
    class="header-logo"
    href="index.html"
  >

    <img
      src="blip-logo.png"
      alt="Loot in a Boot"
    >

  </a>


  <nav>

    <a href="index.html">
      Home
    </a>

    <a
      href="adventures.html"
      class="active"
    >
      Adventures
    </a>

    <a href="pins.html">
      Blipdex
    </a>

    <a href="collection.html">
      My Collection
    </a>

  </nav>

</header>


<main>


<!-- =====================================================
     INTRO
===================================================== -->

<section class="page-intro">

  <p>
    Pull a book from the shelf and discover stories,
    strange places and adventures from across the
    Loot in a Boot universe.
  </p>

</section>



<!-- =====================================================
     LIBRARY
===================================================== -->

<div class="library-stage">


  <!-- =================================================
       SHARK BLIP
  ================================================== -->

  <a
    class="
      book
      book-link
      book-blue
      book-shark
    "

    href="shark-adventure.html"

    aria-label="Read Blip: The Shark Adventure"
  >

    <span class="spine-symbol">
      ◢
    </span>

    <div class="book-tooltip">

      Blip: The Shark Adventure

      <span class="tooltip-status">
        Read Story
      </span>

    </div>

  </a>



  <!-- =================================================
       PIRATE BLIP
  ================================================== -->

  <a
    class="
      book
      book-link
      book-red
      book-pirate
    "

    href="pirate-adventure.html"

    aria-label="Read Blip: Pirates"
  >

    <span class="spine-symbol">
      ☠
    </span>

    <div class="book-tooltip">

      Blip: Pirates!

      <span class="tooltip-status">
        Read Story
      </span>

    </div>

  </a>



  <!-- =================================================
       MYSTERY / FUTURE BOOK
  ================================================== -->

  <div
    class="
      book
      book-black
      book-secret
      book-mystery
    "

    aria-label="Undiscovered story"
  >

    <span class="spine-symbol">
      ?
    </span>

  </div>


</div>


</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

  <div>
    Loot in a Boot
  </div>

  <div>
    The Loot Library · Every treasure has a story.
  </div>

</footer>


</body>

</html>
